name: 'Pipeline 1.1 y 1.2 - Deploy K8s Apps'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tp3/HIT3/k8s/**'
      - 'tp3/HIT3/app/**'

jobs:
  build-and-deploy:
    name: 'Build Docker Image & Deploy to GKE'
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./tp3/HIT3/app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sobel-app:latest

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/996435690701/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'terraform-bot@proyecto-sobel-grupo404.iam.gserviceaccount.com'

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: sobel-cluster
          location: us-central1-a
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      # ── Hit #4: Observabilidad ────────────────────────────────────────────
      - name: Deploy Prometheus + Grafana (kube-prometheus-stack)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f tp3/HIT3/k8s/monitoring/values-prometheus.yaml \
            --wait --timeout 5m

      - name: Apply Prometheus rules and ServiceMonitors
        run: |
          kubectl apply -f tp3/HIT3/k8s/monitoring/prometheus-rules.yaml
          kubectl apply -f tp3/HIT3/k8s/monitoring/servicemonitor-worker.yaml
          kubectl apply -f tp3/HIT3/k8s/monitoring/servicemonitor-joiner.yaml
          kubectl apply -f tp3/HIT3/k8s/monitoring/servicemonitor-dlq-monitor.yaml

      - name: Import Grafana dashboard
        run: |
          kubectl create configmap sobel-grafana-dashboard \
            --from-file=sobel-hit3.json=tp3/HIT3/k8s/monitoring/grafana-dashboard.json \
            -n monitoring --dry-run=client -o yaml | kubectl apply -f -

      # ── Hit #3: Aplicaciones ──────────────────────────────────────────────
      - name: Replace DockerHub username
        run: |
          sed -i "s|tobiasavila142|${{ secrets.DOCKERHUB_USERNAME }}|g" tp3/HIT3/k8s/*.yaml

      - name: Deploy to K8s
        run: |
          # 1.1 Infraestructura
          kubectl apply -f tp3/HIT3/k8s/rabbitmq.yaml
          kubectl apply -f tp3/HIT3/k8s/redis.yaml

          # Esperar a que RabbitMQ inicie antes de lanzar las apps
          kubectl rollout status statefulset/rabbitmq -n default

          # 1.2 Aplicaciones
          kubectl apply -f tp3/HIT3/k8s/api.yaml
          kubectl apply -f tp3/HIT3/k8s/joiner.yaml
          kubectl apply -f tp3/HIT3/k8s/dlq-monitor.yaml

          # El splitter se corre como Job; recrear si cambió la imagen
          kubectl delete job splitter-job --ignore-not-found
          kubectl apply -f tp3/HIT3/k8s/splitter.yaml
