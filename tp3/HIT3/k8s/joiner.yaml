apiVersion: apps/v1
kind: Deployment
metadata:
  name: joiner
  labels:
    app: joiner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: joiner
  template:
    metadata:
      labels:
        app: joiner
    spec:
      nodeSelector:
        role: apps
      containers:
      - name: joiner
        image: tu-usuario-dockerhub/sobel-app:latest
        command: ["python", "joiner.py"]
        ports:
        - name: metrics
          containerPort: 8001
        env:
        - name: RABBIT_HOST
          value: "rabbitmq"
        - name: REDIS_HOST
          value: "redis"
        - name: CANTIDAD_CHUNKS
          value: "4"
---
apiVersion: v1
kind: Service
metadata:
  name: joiner
  labels:
    app: joiner
spec:
  selector:
    app: joiner
  ports:
  - name: metrics
    port: 8001
    targetPort: 8001
