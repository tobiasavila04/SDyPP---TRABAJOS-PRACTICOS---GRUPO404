apiVersion: apps/v1
kind: Deployment
metadata:
  name: sobel-api
  labels:
    app: sobel-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sobel-api
  template:
    metadata:
      labels:
        app: sobel-api
    spec:
      nodeSelector:
        role: apps
      containers:
      - name: api
        image: tu-usuario-dockerhub/sobel-app:latest
        command: ["python", "api.py"]
        ports:
        - name: http
          containerPort: 5000
        env:
        - name: RABBIT_HOST
          value: "rabbitmq"
        - name: REDIS_HOST
          value: "redis"
        - name: CANTIDAD_CHUNKS
          value: "4"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sobel-api
  labels:
    app: sobel-api
spec:
  type: LoadBalancer
  selector:
    app: sobel-api
  ports:
  - name: http
    port: 80
    targetPort: 5000
